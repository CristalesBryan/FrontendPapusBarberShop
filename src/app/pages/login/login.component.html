<div class="papus-login-page">
  <div class="papus-login-card">
    <div class="login-header">
      <div class="login-logo-wrap">
        <img src="/assets/images/Logo.jpeg" alt="Papus BarberShop" class="login-logo">
      </div>
      <h1 class="font-display text-gold mt-3 mb-0" style="font-size: 1.5rem; letter-spacing: 0.1em;">Papus BarberShop</h1>
      <p class="text-cream-muted small mt-2 mb-0" style="letter-spacing: 0.12em; text-transform: uppercase;">Panel de administración</p>
    </div>
    <div class="login-body">
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input
            type="text"
            class="form-control"
            id="username"
            [(ngModel)]="loginRequest.username"
            name="username"
            required
            [disabled]="loading"
            autocomplete="username">
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            [(ngModel)]="loginRequest.password"
            name="password"
            required
            [disabled]="loading"
            autocomplete="current-password">
        </div>

        <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

        <button type="submit" class="btn btn-papus-primary w-100 papus-shimmer-btn" [disabled]="loading">
          <span *ngIf="!loading"><i class="fas fa-sign-in-alt me-2"></i> Iniciar sesión</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Iniciando sesión...
          </span>
        </button>

        <div class="mt-3 text-center">
          <button type="button" class="btn btn-link btn-sm p-0" style="color: var(--cream-muted);" (click)="restablecerPasswordAdmin()" [disabled]="loadingResetPassword">
            <span *ngIf="!loadingResetPassword">¿Restablecer contraseña de admin?</span>
            <span *ngIf="loadingResetPassword"><span class="spinner-border spinner-border-sm me-1"></span> Restableciendo...</span>
          </button>
        </div>
        <div class="alert alert-success mt-2 mb-0" *ngIf="successMessage">{{ successMessage }}</div>
      </form>
    </div>
  </div>
</div>
