<nav class="navbar navbar-expand-lg papus-navbar fixed-top">
    <div class="container-fluid">
        <button type="button"
                class="btn btn-link papus-sidebar-toggle"
                (click)="toggleSidebarMobile()"
                [attr.aria-expanded]="sidebarMobileOpen"
                aria-controls="app-sidebar"
                aria-label="Abrir menú de navegación">
            <i class="fas fa-bars"></i>
        </button>
        <a class="navbar-brand" routerLink="/dashboard">
            <img src="/assets/images/Logo.jpeg" alt="Papus BarberShop" class="navbar-logo">
            <span class="d-none d-md-inline">Papus BarberShop</span>
        </a>
        <button class="navbar-toggler" type="button" (click)="toggleUserMenu()" aria-label="Menú de usuario">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" [class.show]="menuOpen">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown" *ngIf="currentUser">
                    <a class="nav-link dropdown-toggle user-menu-trigger" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle"></i>
                        {{ currentUser.username }}
                        <span class="badge role-badge ms-1">{{ currentUser.rol }}</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li *ngIf="isAdmin()">
                            <a class="dropdown-item" href="#" (click)="abrirModalCambiarPassword(); $event.preventDefault()">
                                <i class="fas fa-key me-2"></i> Cambiar contraseña
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="#" (click)="logout(); $event.preventDefault()">
                                <i class="fas fa-sign-out-alt me-2"></i> Cerrar sesión
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="modal fade" [class.show]="mostrarModalPassword" [style.display]="mostrarModalPassword ? 'block' : 'none'"
     tabindex="-1" role="dialog" (click)="cerrarModalPassword($event)">
    <div class="modal-dialog modal-dialog-centered" role="document" (click)="$event.stopPropagation()">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-gold"><i class="fas fa-key me-2"></i>Cambiar contraseña</h5>
                <button type="button" class="btn-close" (click)="cerrarModalPassword($event)" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted small">Indica tu contraseña actual y la nueva. Mínimo 4 caracteres.</p>
                <div class="mb-3">
                    <label class="form-label">Contraseña actual</label>
                    <input type="password" class="form-control" [(ngModel)]="passwordActual" name="passwordActual"
                           autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Nueva contraseña</label>
                    <input type="password" class="form-control" [(ngModel)]="passwordNueva" name="passwordNueva"
                           autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Repetir nueva contraseña</label>
                    <input type="password" class="form-control" [(ngModel)]="passwordRepetir" name="passwordRepetir"
                           autocomplete="new-password">
                </div>
                <div class="alert alert-danger py-2 mb-0" *ngIf="mensajeErrorPassword">{{ mensajeErrorPassword }}</div>
                <div class="alert alert-success py-2 mb-0" *ngIf="mensajeOkPassword">{{ mensajeOkPassword }}</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-papus-ghost" (click)="cerrarModalPassword($event)">Cancelar</button>
                <button type="button" class="btn btn-papus-primary" (click)="enviarCambioPassword()" [disabled]="enviandoPassword">
                    <span *ngIf="!enviandoPassword">Guardar</span>
                    <span *ngIf="enviandoPassword"><span class="spinner-border spinner-border-sm me-1"></span>Guardando...</span>
                </button>
            </div>
        </div>
    </div>
</div>
<div class="modal-backdrop fade" [class.show]="mostrarModalPassword"
     [style.display]="mostrarModalPassword ? 'block' : 'none'" (click)="cerrarModalPassword($event)"></div>
